[project]
name = "sesame-bot"
version = "0.1.0"
description = "Sesame スマートロックを操作する"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "requests>=2.34.2",
]

[project.scripts]
sesame-bot = "sesame_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
preview = true
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
